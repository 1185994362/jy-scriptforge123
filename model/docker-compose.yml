version: "3.8"

services:
  web:
    build:
      # 构建上下文：index/ 目录（包含 conding/ 和 pyding/）
      context: ..
      # Dockerfile 路径：相对于 context
      dockerfile: model/Dockerfile
    container_name: personal-site
    ports:
      - "8000:8000"
    volumes:
      # 数据持久化（留言等数据不会随容器消失）
      - ../pyding/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - site-net

networks:
  site-net:
    driver: bridge
